name: CI

on:
  pull_request:
    branches: [main]

jobs:
  format:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm audit --omit=dev --audit-level=high
      # Suppressed advisories — reviewed 2026-06-04:
      #
      # rustls-webpki (transitive dep via ureq/reqwest/tauri-plugin-updater, pinned at 0.103.11):
      #   RUSTSEC-2026-0098: URI name constraints incorrectly accepted. Low risk — requires
      #                      certificate misissuance and we don't assert URI names.
      #   RUSTSEC-2026-0099: Wildcard names bypass name constraints. Same low-risk preconditions.
      #   RUSTSEC-2026-0104: Panic parsing CRL with empty BIT STRING in onlySomeReasons. DoS only,
      #                      and we don't use CRLs. Fix requires 0.103.13+ (waiting on upstream).
      #
      # atk / atk-sys (transitive dep, Linux CI only — not in macOS production builds):
      #   RUSTSEC-2024-0413: atk crate unmaintained (INFO). GTK3 binding, no security impact.
      #   RUSTSEC-2024-0416: atk-sys crate unmaintained (INFO). Same — migrate to gtk4-rs if needed.
      #
      # quick-xml (transitive dep via plist, pinned at 0.38.4 — plist 1.9 still uses 0.39,
      # and the fix lands in quick-xml 0.41+, so no reachable upgrade yet):
      #   RUSTSEC-2026-0194: Quadratic run time checking a start tag for duplicate attribute names.
      #                      DoS only, and we only parse trusted diskutil/Tauri plist output.
      #   RUSTSEC-2026-0195: Unbounded namespace-declaration allocation in NsReader (memory DoS).
      #                      Same — inputs are not attacker-controlled. Waiting on upstream plist.
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          ignore: RUSTSEC-2026-0098,RUSTSEC-2026-0099,RUSTSEC-2026-0104,RUSTSEC-2024-0413,RUSTSEC-2024-0416,RUSTSEC-2026-0194,RUSTSEC-2026-0195

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  rust:
    name: Rust
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
